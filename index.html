<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ribera Sport</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background-color: #f8f9fa;
      background-image: url('bg.jpg');
      background-repeat: repeat;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 2rem);
      max-height: calc(100dvh - 2rem);
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="alex.jpg" alt="Alex">
</body>
</html>
